# Runs the tests on GitHub at every push and pull request.
# They need no GPU and no data: a tiny untrained model and the command lines of the scripts, about 20 seconds.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read                      # the job only reads the repository

jobs:
  tests:
    runs-on: windows-latest           # the code is written and measured on Windows
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip                  # keeps the downloaded packages between runs

      - name: Install PyTorch (CPU build), then the rest of requirements.txt
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt

      - name: Run the tests
        run: python -m unittest test_clean test_model test_train test_cli
